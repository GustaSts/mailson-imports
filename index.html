<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mailson Imports</title>
<meta name="description" content="Mailson Imports — site temporariamente fora do ar. Atendimento pelo WhatsApp.">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Hanken+Grotesk:wght@300;400;500&display=swap">
<style>
/* Página de pausa: a vitrine apaga, a marca fica. Logo, um recado curto e o WhatsApp. */
:root{
  --bg:#070707;--fg:#f4f2ec;--mut:#8e8b84;--line:#2c2c2c;
  --gold:#c9a24b;--gold-hi:#f0d78d;--gold-lo:#8a6a28;--wa:#25d366;
  --display:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;display:grid;place-items:center;
  padding:max(32px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(circle at 50% 30%,rgba(201,162,75,.12),transparent 60%)}
main{width:min(520px,100%);text-align:center;display:grid;justify-items:center;gap:22px}
img{width:min(240px,62vw);height:auto;display:block}
.eyebrow{font-family:var(--display);font-weight:500;font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:500;font-size:clamp(2rem,7vw,3rem);line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 span{background:linear-gradient(100deg,var(--gold-lo),var(--gold-hi) 40%,var(--gold) 60%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--mut);font-size:1.05rem;line-height:1.6;font-weight:300;max-width:40ch}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);color:var(--fg);transition:transform .3s,border-color .3s}
.btn:hover{transform:translateY(-2px);border-color:var(--gold)}
.btn.wa{background:var(--wa);color:#05210f;border-color:transparent}
.btn svg{width:18px;height:18px;flex:none}
.line{width:56px;height:1px;background:var(--gold);opacity:.7}
small{color:var(--mut);font-size:.82rem}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="Mailson Imports">
  <div class="eyebrow">Site temporariamente fora do ar</div>
  <h1>Voltamos <span>em breve.</span></h1>
  <p>Estamos preparando novidades para a loja. Enquanto isso, o atendimento continua normalmente pelo WhatsApp e pelo Instagram.</p>
  <div class="btns">
    <a class="btn wa" href="https://wa.me/5575998105387?text=Ol%C3%A1!%20Vim%20pelo%20site%20da%20Mailson%20Imports." target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 00-7.7 13.6L3 21l4.5-1.2A9 9 0 1012 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.5-2-1.5-2.4-2.4l.8-1-1-2L9.5 7.5" fill="currentColor"/></svg>
      Falar no WhatsApp</a>
    <a class="btn" href="https://www.instagram.com/mailson_imports/" target="_blank" rel="noopener">@mailson_imports</a>
  </div>
  <div class="line" aria-hidden="true"></div>
  <small>(75) 99810-5387 · Cruz das Almas, BA</small>
</main>
</body>
</html>
